<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar sesión - AGORA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="login-uta">
    <img class="avatar" src="{{ url_for('static', filename='imagenes/logo.jpg') }}" alt="logo">
    <h1>INICIO DE SESIÓN</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="email">Correo Electrónico</label>
      <input id="email" name="email" type="email" placeholder="Correo Electrónico" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Contraseña" required>

      <input type="submit" value="INICIAR SESIÓN">
    </form>

    <a href="#">¿Has perdido tu contraseña?</a><br>
    <a href="{{ url_for('registro') }}">¿No tienes cuenta? Regístrate</a>
  </div>
</body>
</html>
