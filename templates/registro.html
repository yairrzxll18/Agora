<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
</head>
<body>
  <div class="registro-uta">
    <img class="logo" src="{{ url_for('static', filename='imagenes/logo.jpg') }}" alt="Logo">
    <h1>REGISTRARSE</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('registro') }}">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" type="text" placeholder="Nombre de usuario" required>

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="Correo electrónico" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Contraseña" required>

      <input type="submit" value="REGISTRARSE">
    </form>

    <a href="{{ url_for('login') }}">Volver a iniciar sesión</a>
  </div>
</body>
</html>
