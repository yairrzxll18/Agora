<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configuración</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>
<body>
  <main style="max-width:900px;margin:40px auto;padding:20px;">
    <section class="profile-card-side" style="padding:20px;">
      <h2>Configuración</h2>

      <form method="post" style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <label>Nombre visible</label>
        <input name="nombre_visible" type="text" value="{{ usuario.nombre_usuario if usuario else '' }}" style="padding:8px;border-radius:8px;border:1px solid #ddd;">

        <label>Correo</label>
        <input name="correo" type="email" value="{{ usuario.correo_usuario if usuario and usuario.correo_usuario else usuario.email if usuario and usuario.email else '' }}" style="padding:8px;border-radius:8px;border:1px solid #ddd;">

        <label>Teléfono</label>
        <input name="telefono" type="text" value="{{ usuario.telefono if usuario and usuario.telefono else '' }}" style="padding:8px;border-radius:8px;border:1px solid #ddd;">

        <div style="display:flex;gap:8px;margin-top:12px;">
          <button type="submit" class="btn edit" style="padding:8px 14px;">Guardar</button>
          <a href="{{ url_for('perfil') }}" class="btn ghost" style="display:inline-flex;align-items:center;padding:8px 12px;">Cancelar</a>
          <a href="{{ url_for('dashboard') }}" class="btn ghost" style="display:inline-flex;align-items:center;padding:8px 12px;margin-left:auto;">Volver al dashboard</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
